{% extends "base.html" %}
{% block title %}Mein Konto{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Mein Konto</h1>
  <p>{{ user.display_name }} ({{ user.username }}){% if user.is_admin %} · Administration{% endif %}</p>
  <h2>Passwort ändern</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/account/password">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Bisheriges Passwort <input type="password" name="old" required></label>
    <label>Neues Passwort (mind. 10 Zeichen) <input type="password" name="new" minlength="10" required></label>
    <label>Neues Passwort wiederholen <input type="password" name="new2" minlength="10" required></label>
    <button>Ändern</button>
  </form>
</section>
{% endblock %}
