{% extends "base.html" %}
{% block title %}Ersteinrichtung{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Ersteinrichtung</h1>
  <p>Erstellen Sie das erste Administrationskonto. Weitere Lehrpersonen können danach unter «Benutzer» erfasst werden.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/setup">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Name (Anzeige) <input name="display_name" required></label>
    <label>Benutzername <input name="username" required></label>
    <label>Passwort (mind. 10 Zeichen) <input type="password" name="password" minlength="10" required></label>
    <label>Passwort wiederholen <input type="password" name="password2" minlength="10" required></label>
    <button>Einrichten</button>
  </form>
</section>
{% endblock %}
