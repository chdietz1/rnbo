name: EarStage Plugin bauen

on:
  push:
    paths:
      - "binaural-iem/**"
      - ".github/workflows/earstage-build.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine-Tests
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Ibinaural-iem/Source binaural-iem/tests/engine_test.cpp -o engine_test
          ./engine_test

  macos:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurieren (Universal Binary arm64 + x86_64)
        run: >
          cmake -S binaural-iem -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Bauen
        run: cmake --build build --config Release --target EarStage_VST3 EarStage_AU -- -quiet

      - name: Ad-hoc signieren und packen
        run: |
          mkdir -p dist
          cp -R build/EarStage_artefacts/Release/VST3/EarStage.vst3 dist/
          cp -R build/EarStage_artefacts/Release/AU/EarStage.component dist/
          codesign --force --deep --sign - dist/EarStage.vst3
          codesign --force --deep --sign - dist/EarStage.component
          cp binaural-iem/README.md dist/LIESMICH.md
          # GitHub-Artefakte verlieren Dateirechte -> vorher mit ditto zippen (behält +x und Signatur)
          ditto -c -k --sequesterRsrc dist EarStage-macOS.zip

      - name: AU validieren
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          ditto dist/EarStage.component ~/Library/Audio/Plug-Ins/Components/EarStage.component
          killall -9 AudioComponentRegistrar || true
          auval -v aufx ErSt Bstl

      - uses: actions/upload-artifact@v4
        with:
          name: EarStage-macOS
          path: EarStage-macOS.zip

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurieren (x64, statische Runtime -> kein VC++-Redistributable nötig)
        run: >
          cmake -S binaural-iem -B build -A x64
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Bauen
        run: cmake --build build --config Release --target EarStage_VST3

      - name: Mit pluginval prüfen
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # pluginval ist unter Windows eine GUI-App -> Exit-Code unzuverlässig, Ausgabe auswerten
          $out = .\pluginval\pluginval.exe --strictness-level 8 --validate-in-process --skip-gui-tests --timeout-ms 300000 build\EarStage_artefacts\Release\VST3\EarStage.vst3 | Out-String
          Write-Output $out
          if ($out -notmatch "SUCCESS" -or $out -match "FAILED") { exit 1 }
          exit 0

      - name: Packen
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item -Recurse build\EarStage_artefacts\Release\VST3\EarStage.vst3 dist\
          Copy-Item binaural-iem\README.md dist\LIESMICH.md

      - uses: actions/upload-artifact@v4
        with:
          name: EarStage-Windows
          path: dist
